#config_version=6

event_player:
  mode_attract_started: test_event_here

slide_player:
  mode_attract_started: attract
  timer_attract_overlay_tick{ticks==5}: attract_overlay
  timer_attract_overlay_complete:
    attract_overlay:
      action: remove

sound_player:
  mode_attract_started:
    station_alert:
      track: music
  timer_attract_overlay_complete:
    station_alert:
      action: stop

widget_player:
  slide_attract_active:
    timer_widget:
      slide: attract


timers:
  attract_overlay:
    end_value: 10
    start_running: true
    restart_on_complete: true