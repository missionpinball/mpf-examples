[keyboard]

e=["event", "test_event"]
enter=["switch", "s_start_button"]
v=["switch", "s_flipper_left"]
z=["switch", "s_flipper_right"]
1=["switch", "s_switch_1"]
2=["switch", "s_switch_2"]
3=["switch", "s_switch_3"]
4=["switch", "s_switch_4"]
x=["switch", "s_trough_3", "toggle"]
w=["event", "start_mode_widget_examples"]
shift+w=["event", "stop_mode_widget_examples"]

[sound_system]

music={
"type": "solo"
}
effects={
"default": true,
"simultaneous_sounds": 3,
"type": "simultaneous"
}
voice={
"type": "sequential"
}

[logging]

global=1

[mpf]

spawn_mpf=true
virtual=true
executable_path="/Users/Anthony/mpf312/bin/mpf"
verbose=true
